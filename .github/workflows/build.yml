# exTile 自动构建工作流
# 触发方式:push 到 master 分支,或在 GitHub 仓库的 Actions 页面手动触发(workflow_dispatch)
# 构建产物:Debug APK + 未签名 Release APK(以 artifact 形式上传,不发布 Release、不做签名)
name: 构建 APK

on:
  # push 到 master 分支时自动构建
  push:
    branches: [ master ]
  # 允许在 Actions 页面手动点击触发,方便随时出包
  workflow_dispatch:

# 最小权限原则:构建只需要读取仓库内容,不需要任何写权限
permissions:
  contents: read

# 同一分支上,新的 push 会自动取消仍在排队/运行中的旧构建,避免浪费 runner 时长
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    # 构建正常应在 10 分钟左右完成;30 分钟上限防止异常挂起占用 runner
    timeout-minutes: 30

    steps:
      # 1. 检出仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装 JDK 21(Temurin 发行版)
      # gradle/gradle-daemon-jvm.properties 中强制 toolchainVersion=21,
      # Gradle 9 的 Daemon JVM Criteria 要求必须用 JDK 21 启动守护进程
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. 配置 Gradle 环境
      # 该 action 自动缓存 Gradle 依赖与 configuration cache
      # (项目 gradle.properties 已开启 org.gradle.configuration-cache),加速后续构建
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 4. 安装 compileSdk 37 对应的 Android 平台包
      # GitHub 的 ubuntu runner 已预装 Android SDK 且预接受许可;
      # build-tools 无需显式安装,AGP 会按需自动下载
      - name: 安装 Android SDK 平台
        run: sdkmanager --install "platforms;android-37"

      # 5. 补充 gradlew 可执行权限
      # (在 Windows 上开发时提交的 gradlew 可能未保留执行位,Linux runner 上必须可执行)
      - name: 赋予 gradlew 可执行权限
        run: chmod +x gradlew

      # 6. 一次构建两个变体,共享依赖下载与配置缓存,速度更快
      #    - Debug:产出可直接安装的 app-debug.apk
      #    - Release:项目无签名配置,产出未签名的 app-release-unsigned.apk,
      #      并生成 R8 混淆映射文件 mapping.txt(崩溃日志反混淆时需要)
      - name: 构建 Debug 与 Release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # 7. 上传 Debug APK 作为构建产物
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: exTile-debug
          path: app/build/outputs/apk/debug/*.apk
          # 产物缺失时直接报错,避免静默上传空产物
          if-no-files-found: error

      # 8. 上传未签名 Release APK 与 mapping.txt
      - name: 上传 Release APK(未签名)
        uses: actions/upload-artifact@v4
        with:
          name: exTile-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
